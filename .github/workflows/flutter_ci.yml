name: Restro Hub CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=https://dummy-project.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy-anon-key" >> .env

      - name: Precache Flutter Artifacts
        run: flutter precache --ios

      - name: Clean & Re-bind iOS Project Structure
        run: |
          rm -rf ios/Pods ios/Podfile.lock ios/Flutter/podhelper.rb
          flutter clean
          flutter pub get
          flutter create . --platforms=ios

      - name: Verify podhelper.rb Existence
        run: |
          if [ -f "ios/Flutter/podhelper.rb" ]; then
            echo "SUCCESS: podhelper.rb exists!"
            ls -la ios/Flutter/
          else
            echo "ERROR: podhelper.rb still missing!"
            ls -la ios/
            exit 1
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Tests
        run: flutter test

      - name: Build iOS
        run: flutter build ios --no-codesign --release

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7