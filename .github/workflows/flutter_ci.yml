  name: Restro Hub CI/CD

  on:
    push:
      branches: [ "main", "develop" ]
    pull_request:
      branches: [ "main", "develop" ]

  jobs:
    build:
      name: Build & Test
      runs-on: macos-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: 'zulu'
            java-version: '17'

        - name: Set up Flutter
          uses: subosito/flutter-action@v2
          with:
            channel: 'stable'
            cache: true

        - name: Cache Pub dependencies
          uses: actions/cache@v4
          with:
            path: |
              ~/.pub-cache
              ${{ github.workspace }}/.dart_tool
            key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
            restore-keys: |
              ${{ runner.os }}-pub-

        - name: Cache Gradle
          uses: actions/cache@v4
          with:
            path: |
              ~/.gradle/caches
              ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            restore-keys: |
              ${{ runner.os }}-gradle-

        - name: Cache Pods
          uses: actions/cache@v4
          with:
            path: ios/Pods
            key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
            restore-keys: |
              ${{ runner.os }}-pods-

        - name: Setup CocoaPods
          run: |
            sudo gem install --user-install cocoapods -v 1.14.3
            pod setup --silent
            pod repo update

        - name: Create .env file
          run: |
            echo "SUPABASE_URL=https://dummy-project.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=dummy-anon-key" >> .env

        - name: Install dependencies
          run: flutter pub get

        - name: Run build_runner
          run: flutter pub run build_runner build --delete-conflicting-outputs

        - name: Run Tests
          run: flutter test

        - name: Build iOS
          run: flutter build ios --no-codesign --release

        - name: Build Android APK
          run: flutter build apk --debug